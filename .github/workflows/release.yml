name: release

# Two ways in:
#  - push to `main` (a merged PR, or a direct push) - the normal path, cuts
#    the next patch release automatically.
#  - push of a `v*` tag - manual/one-off (e.g. re-cutting an old version).
#
# These deliberately share one workflow rather than living in a separate
# auto-tag workflow that pushes a tag to re-trigger this one: GitHub Actions
# caches (see Swatinem/rust-cache below) are scoped per git ref, and only
# ever fall back across refs to the *default branch*'s cache. Every past
# release ran on its own one-shot tag (v0.1.0, v0.1.1, ...), which is a ref
# that never repeats - so every single one built the entire LanceDB/
# DataFusion/Arrow dependency tree from nothing, twice (once per
# architecture), because there was no default-branch cache for a tag build
# to ever fall back to (confirmed: the cache each of those runs saved sat
# under `refs/tags/vX.Y.Z` and was never restorable by anything). Running
# the automatic path on `main` itself means its cache *is* the default-
# branch cache, so it warms up over time and every later run - including a
# rare manual tag build - can actually use it. This is the fix; there was no
# slow build setting to tune (LTO is already off, codegen-units already
# default).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    # Escape hatch for a CI/docs-only push that doesn't warrant a release -
    # put "[skip release]" anywhere in the triggering commit message (for a
    # squash or merge commit, that's the PR title/body).
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the `main`-push path below needs to see
          # every existing `v*` tag to compute the next one. The default
          # shallow checkout (fetch-depth: 1) fetches no tags at all.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # lancedb's build scripts need protoc; the macOS runner doesn't ship it.
      - run: brew install protobuf

      - run: npm ci

      - name: Compute the version to release
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
            latest=${latest:-v0.0.0}
            IFS='.' read -r major minor patch <<< "${latest#v}"
            echo "version=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
          fi

      - name: Build hook-bridge (universal)
        run: scripts/prepare-hook-bridge.sh universal-apple-darwin

      - name: Build app (universal dmg)
        run: >
          npm run tauri build --
          --target universal-apple-darwin
          --bundles dmg
          --config src-tauri/tauri.release.conf.json

      - name: Name the artifact and hash it
        id: pkg
        run: |
          version="${{ steps.ver.outputs.version }}"
          src=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          dest="taisk_${version}_universal.dmg"
          cp "$src" "$dest"
          shasum -a 256 "$dest" | tee "$dest.sha256"
          echo "dmg=$dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dest" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          # Creates the tag (pointing at this commit) when triggered from
          # `main`, where it doesn't exist yet; a no-op tag match when
          # triggered from an actual tag push.
          tag_name: v${{ steps.pkg.outputs.version }}
          files: |
            ${{ steps.pkg.outputs.dmg }}
            ${{ steps.pkg.outputs.dmg }}.sha256
          generate_release_notes: true

  # Keeps the Homebrew tap in lockstep with every release this workflow
  # publishes — otherwise `brew install taisk` silently stays pinned to
  # whatever version was last hand-bumped in homebrew-taisk (this is exactly
  # how the "fixed" bugs from v0.1.3 would have kept shipping to anyone on
  # Homebrew: the fix landing on `main`/being tagged here doesn't reach them
  # until this cask file changes too). Needs its own cross-repo token
  # (`HOMEBREW_TAP_TOKEN`, a fine-grained PAT with Contents: Read & write on
  # homebrew-taisk) since the default GITHUB_TOKEN is scoped to the repo the
  # workflow runs in and can't push to another one.
  update-homebrew-tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omrico94/homebrew-taisk
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump cask version and sha256
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/taisk.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" Casks/taisk.rb
          git config user.name "taisk-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet Casks/taisk.rb && exit 0
          git commit -am "taisk ${VERSION}"
          git push
