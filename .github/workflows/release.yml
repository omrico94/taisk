name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # lancedb's build scripts need protoc; the macOS runner doesn't ship it.
      - run: brew install protobuf

      - run: npm ci

      - name: Build hook-bridge (universal)
        run: scripts/prepare-hook-bridge.sh universal-apple-darwin

      - name: Build app (universal dmg)
        run: >
          npm run tauri build --
          --target universal-apple-darwin
          --bundles dmg
          --config src-tauri/tauri.release.conf.json

      - name: Name the artifact and hash it
        id: pkg
        run: |
          version="${GITHUB_REF_NAME#v}"
          src=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          dest="taisk_${version}_universal.dmg"
          cp "$src" "$dest"
          shasum -a 256 "$dest" | tee "$dest.sha256"
          echo "dmg=$dest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$dest" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.dmg }}
            ${{ steps.pkg.outputs.dmg }}.sha256
          generate_release_notes: true

  # Keeps the Homebrew tap in lockstep with every release this workflow
  # publishes — otherwise `brew install taisk` silently stays pinned to
  # whatever version was last hand-bumped in homebrew-taisk (this is exactly
  # how the "fixed" bugs from v0.1.3 would have kept shipping to anyone on
  # Homebrew: the fix landing on `main`/being tagged here doesn't reach them
  # until this cask file changes too). Needs its own cross-repo token
  # (`HOMEBREW_TAP_TOKEN`, a fine-grained PAT with Contents: Read & write on
  # both this repo and homebrew-taisk) since the default GITHUB_TOKEN is
  # scoped to the repo the workflow runs in and can't push to another one.
  update-homebrew-tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: omrico94/homebrew-taisk
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump cask version and sha256
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          sed -i "s/version \"[^\"]*\"/version \"${VERSION}\"/" Casks/taisk.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"${SHA256}\"/" Casks/taisk.rb
          git config user.name "taisk-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git diff --quiet Casks/taisk.rb && exit 0
          git commit -am "taisk ${VERSION}"
          git push
