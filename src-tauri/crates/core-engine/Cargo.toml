[package]
name = "core-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.91"
axum = { version = "0.8.9", features = ["ws"] }
dirs = "6.0.0"
futures = "0.3.33"
lancedb = "0.31.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
